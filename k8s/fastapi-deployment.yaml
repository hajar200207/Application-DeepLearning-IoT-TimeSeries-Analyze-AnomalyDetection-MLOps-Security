apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
        - name: fastapi
          image: application-deeplearning-iot-timeseries-analyze-anomalydetection-mlops-security-fastapi-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
